org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Текущая версия. Единая схема для всех сборок: MAJOR*10000 + MINOR*100 + PATCH.
# versionCode должен только расти — иначе Android откажется ставить обновление поверх.
# 1.0.45 -> 10045 (у установленной 1.0.44 было 10044, обновление пройдёт).
versionCode=10045
versionName=1.0.45
