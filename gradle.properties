org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Текущая версия. Единая схема для всех сборок: MAJOR*10000 + MINOR*100 + PATCH.
# versionCode должен только расти — иначе Android откажется ставить обновление поверх.
# 1.0.44 -> 10044 (у установленной 1.0.43 было 10043, обновление пройдёт).
versionCode=10044
versionName=1.0.44
