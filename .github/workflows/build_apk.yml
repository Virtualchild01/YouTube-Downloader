name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Автоматический перенос файлов в корень, если проект загружен внутри папки YTDownloader
      - name: Check and adjust project structure
        run: |
          if [ -d "YTDownloader" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Moving files from YTDownloader subdirectory to root..."
            shopt -s dotglob
            mv YTDownloader/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Постоянный ключ подписи (гарантирует установку обновления поверх старого приложения)
      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
          else
            gradle assembleDebug -PversionCode=${{ github.run_number }}
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
